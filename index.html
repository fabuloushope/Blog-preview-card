<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Blog preview card</title>
	</head>
	<body>
		<section>
			<div class="head-section">
				<div class="main-img">
					<img
						src="./assets/illustration-article.svg"
						alt="Blog preview image"
					/>
				</div>
				<div class="initialise">
					<p>Learning</p>
				</div>
			</div>
			<main>
				<div class="main-section">
					<span class="publish-date">Published 21 Dec 2023</span>
					<h1 class="main-heading">HTML & CSS Foundations</h1>
				</div>
				<div class="avatar">
					<div class="avatar-img">
						<img src="./assets/image-avatar.webp" alt="Avatar image" />
					</div>
					<div class="avatar-name">
						<p>Greg Hooper</p>
					</div>
				</div>
			</main>
		</section>
	</body>
</html>
